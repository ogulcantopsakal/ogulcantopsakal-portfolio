<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ogulcan Topsakal</title>
    <meta
      name="description"
      content="Portfolio of Ogulcan Topsakal, a Unity game developer."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <a class="name" href="#/">Ogulcan Topsakal</a>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="bar-end" id="social"></div>
    </header>
    <main id="main" class="shell"></main>
    <dialog class="lightbox">
      <button type="button" class="lightbox-close" aria-label="Close">×</button>
      <button type="button" class="lightbox-prev" aria-label="Previous">‹</button>
      <div class="lightbox-viewport">
        <div class="lightbox-track">
          <div class="lightbox-slide"><img class="lightbox-side" alt="" draggable="false"></div>
          <div class="lightbox-slide"><img class="lightbox-current" alt="" draggable="false"></div>
          <div class="lightbox-slide"><img class="lightbox-side" alt="" draggable="false"></div>
        </div>
      </div>
      <button type="button" class="lightbox-next" aria-label="Next">›</button>
      <p class="lightbox-count" aria-live="polite"></p>
    </dialog>
    <script src="data.js"></script>
    <script src="site.js"></script>
  </body>
</html>
